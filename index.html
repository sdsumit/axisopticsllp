<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axis Optics LLP</title>
<meta name="description" content="Axis Optics LLP — optical lens distribution, and Vantap, a WhatsApp messaging platform for SMBs.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://axisopticsllp.com/">
<style>
  :root{
    --ink:#1B2233;
    --paper:#FAFAF8;
    --line:#E4E4DE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:2rem;
  }
  .wrap{max-width:44rem;width:100%;text-align:center;}
  h1{font-size:1.4rem;font-weight:600;margin:0 0 2.5rem;color:#555;}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;}
  a.tile{
    display:block;text-decoration:none;color:var(--ink);
    border:1px solid var(--line);padding:2.2rem 1.5rem;
    background:#fff;transition:border-color .15s ease;
  }
  a.tile:hover{border-color:#999;}
  a.tile .name{font-size:1.3rem;font-weight:700;display:block;margin-bottom:.5rem;}
  a.tile .desc{font-size:.9rem;color:#6b6b6b;}
  @media (max-width:560px){
    .choices{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Axis Optics LLP</h1>
    <div class="choices">
      <a class="tile" href="lens/">
        <span class="name">Axis Optics</span>
        <span class="desc">Optical lens distribution &amp; Shamir dealership</span>
      </a>
      <a class="tile" href="software/">
        <span class="name">Vantap</span>
        <span class="desc">WhatsApp messaging for SMBs</span>
      </a>
    </div>
  </div>
</body>
</html>
